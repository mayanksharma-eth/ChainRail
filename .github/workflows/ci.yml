name: ci

on:
  push: { branches: [main] }
  pull_request:

# Action versions are pinned to majors that run on Node 24. GitHub deprecated the
# Node 20 runtime, and actions still targeting it emit a warning on every run.
env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT setting `RUSTFLAGS: -D warnings` globally: RUSTFLAGS applies
  # to dependencies too, so a new warning in an upstream crate would break CI for
  # reasons unrelated to this repository. The explicit `clippy -- -D warnings`
  # below scopes the strictness to our own code, which is what we actually want.

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chainrail
          POSTGRES_PASSWORD: chainrail
          # Named `chainrail_test` on purpose: the integration harness TRUNCATEs
          # every table between tests and asserts the target database is a
          # dedicated test one, so it can never wipe an application database.
          POSTGRES_DB: chainrail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chainrail"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true

      # librdkafka is built from source by rdkafka-sys. It needs cmake, and its
      # OAUTHBEARER/OIDC support needs libcurl headers -- absent on the runner,
      # though present in the Rust Docker image, which is why the container build
      # passes without them.
      - name: install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libcurl4-openssl-dev \
            libsasl2-dev \
            libssl-dev \
            pkg-config \
            zlib1g-dev

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all
        env:
          APP_ENV: test
          TEST_DATABASE_URL: postgres://chainrail:chainrail@127.0.0.1:5432/chainrail_test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
