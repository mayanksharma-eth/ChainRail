[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/database",
    "crates/observability",
    "crates/rpc",
    "crates/signer",
    "crates/chains-evm",
    "crates/ledger",
    "crates/events",
    "crates/risk",
    "crates/deposits",
    "crates/withdrawals",
    "crates/api",
    "apps/server",
    "apps/worker",
    "tests/integration",
    "tests/load",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/example/chainrail"

[workspace.dependencies]
# --- internal ---
chainrail-common = { path = "crates/common" }
chainrail-database = { path = "crates/database" }
chainrail-observability = { path = "crates/observability" }
chainrail-rpc = { path = "crates/rpc" }
chainrail-signer = { path = "crates/signer" }
chainrail-chains-evm = { path = "crates/chains-evm" }
chainrail-ledger = { path = "crates/ledger" }
chainrail-events = { path = "crates/events" }
chainrail-risk = { path = "crates/risk" }
chainrail-deposits = { path = "crates/deposits" }
chainrail-withdrawals = { path = "crates/withdrawals" }
chainrail-api = { path = "crates/api" }

# --- async runtime ---
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# --- web ---
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7", features = ["trace", "limit", "request-id", "util", "timeout"] }
hyper = "1"

# --- storage ---
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "bigdecimal", "macros", "migrate", "json",
] }
redis = { version = "1.6", features = ["tokio-comp", "connection-manager", "script"] }

# --- messaging ---
rdkafka = { version = "0.39", default-features = false, features = ["cmake-build", "libz", "tokio"] }

# --- chain ---
alloy = { version = "2.4", default-features = false, features = [
    "std", "consensus", "eips", "signer-local", "sol-types", "rlp", "serde",
] }

# --- serde / data ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bigdecimal = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha3 = "0.10"
humantime-serde = "1"

# --- http client ---
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "gzip", "charset", "http2"] }

# --- observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# --- utils ---
thiserror = "2"
anyhow = "1"
config = { version = "0.15", default-features = false, features = ["toml", "yaml"] }
dotenvy = "0.15"
governor = "0.10"
rand = "0.9"
parking_lot = "0.12"
once_cell = "1"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
